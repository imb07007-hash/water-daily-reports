name: Maintenance Excel and login browser tests
on:
  pull_request:
    paths: ['assets/maintenance*.js', 'assets/core-app.js', 'index.html', 'tests/**', 'playwright.config.cjs', 'package.json', '.github/workflows/maintenance-ci.yml']
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: maintenance-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-excel-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund
      - name: Select browser for Playwright
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'WSC_PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify maintenance roles, lock enforcement and audited edits
        run: node --test tests/maintenance-record-lock.test.cjs tests/maintenance-record-owner-edit.test.cjs
      - name: Run actual browser login and XLSX roundtrip tests
        run: npm run test:e2e

  production-smoke:
    name: Verify live Render assets after release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser-excel-login
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public production site and actual deployed XLSX writer
        run: node tests/production-smoke.cjs
