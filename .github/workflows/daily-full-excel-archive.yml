name: Daily full Excel archive (all source plants)
on:
  schedule:
    - cron: '32 5 * * *' # 08:32 Asia/Riyadh; after the production spreadsheet refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-full-excel-archive.yml'
permissions:
  contents: read
concurrency:
  group: water-source-full-excel-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive untouched source Excel and sync new permitted station reports
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/archive-source-scheduled.cjs
