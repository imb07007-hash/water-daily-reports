name: Water reports - quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Validate all browser JavaScript syntax
        run: |
          for f in assets/*.js; do
            node --check "$f"
          done
      - name: Run source and import regression tests
        run: node --test tests/*.test.cjs
