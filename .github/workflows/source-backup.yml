name: Water reports source snapshot
on:
  push:
    paths:
      - '.github/workflows/source-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v4
      - name: Export entire recoverable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: water-reports-restore-source-2026-11-08
          path: |
            index.html
            recovery_snapshot/**
          retention-days: 7
          if-no-files-found: error
