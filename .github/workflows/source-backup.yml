name: Water reports - source snapshot
on:
  push:
    paths:
      - 'index.html'
      - 'chemicals.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'recovery_snapshot/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v4
      - name: Archive full deployed static source and supporting files
        uses: actions/upload-artifact@v4
        with:
          name: water-reports-source
          path: |
            index.html
            chemicals.html
            assets/**
            tests/**
            .github/workflows/**
            recovery_snapshot/**
          retention-days: 30
          if-no-files-found: error
